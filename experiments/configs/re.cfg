# ==============================================================================
# NavSolver configuration — Rounded-corner channel, Re=9600
# ==============================================================================

# Grid
numCellsX      = 360
numCellsY      = 120
numCellsZ      = 60
baseUnit       = 60

# Physical domain
domainLengthX  = 12.0
domainLengthY  = 2.0
domainLengthZ  = 1.0

# Physics
reynoldsNumber = 9600.0
hyperViscousRe = 10.0
hyperViscousStart = 2000

# Time integration
maxTimeSteps   = 20000
reportEveryN   = 200
convergenceTol = 1e-7
numPressureIter = 15

# Geometry and boundary conditions
geometryShape  = RoundedCorner
geometryType   = Curved
lateralBC      = Periodic
outletBC       = ZeroFirstDeriv
initialProfile = PotentialFlow
flowType       = SteadyMarching

# Output
outputDir      = experiments/results/cam_re9600
runName        = cam_re9600
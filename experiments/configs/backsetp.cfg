# ====================================================================
# Backward-facing step (abrupt expansion) – Re_h ≈ 100
# Geometry: inlet height = 1.0, outlet height = 2.0, step height h = 1.0
# Bulk inlet velocity ≈ 1.5 (from parabolic profile) → Re_h = 150
# To match Re_h = 100 exactly, set reynoldsNumber = 66.7 in config.
# However, qualitative features are similar; we'll compare reattachment length.
# ====================================================================

# Grid – sufficiently fine, KK=20 avoids indexing bugs
numCellsX      = 240
numCellsY      = 80
numCellsZ      = 20

# Physical dimensions (Cmp x Alt x Lrg)
domainLengthX  = 6.0
domainLengthY  = 2.0
domainLengthZ  = 1.0

# Reynolds number (global, based on domain height 2.0 and bulk velocity?)
# For step height h = 1.0 and U_bulk ≈ 1.5, Re_h = 150.
# If you want Re_h = 100, set reynoldsNumber = 66.7.
# We'll keep 100 for now – literature uses Re_h = 100.
reynoldsNumber = 100.0

# Disable hyper‑viscous sponge
hyperViscousStart = 0

# Geometry – abrupt expansion (step at i ≈ II/12)
geometryShape  = AbruptExpansion

# Boundary conditions
lateralBC      = SolidWall
outletBC       = ZeroFirstDeriv
initialProfile = InletProfile

# Time integration – steady marching
flowType       = SteadyMarching
maxTimeSteps   = 8000
convergenceTol = 1e-9
numPressureIter = 5
reportEveryN   = 500

# Output
outputDir      = experiments/results/backstep_validation
runName        = step_re100
# ============================================================
# Poiseuille flow between parallel plates (y-direction walls)
# Exact parabolic profile, Re=100
# ============================================================

# Grid resolution (fine enough for profile capture)
numCellsX      = 40
numCellsY      = 40
numCellsZ      = 1          # 2D simulation (1 cell in z)

# Physical domain (length X, height Y, depth Z)
domainLengthX  = 4.0
domainLengthY  = 1.0
domainLengthZ  = 0.1

# Reynolds number
reynoldsNumber = 100.0

# Hyper‑viscous sponge (disabled)
hyperViscousRe = 20.0
hyperViscousStart = 0

# Geometry: straight channel (all cells active)
# We fake a "straight channel" by setting jLow=0 and jHigh=numCellsY for all i.
# The code's default (if geometryShape not set) should produce full domain.
# To be safe, we set geometryShape to AbruptExpansion with jLow=0, jHigh=J.
# Alternatively, the code falls back to full domain when no special geometry is set.
# We'll use a dummy shape that gives full domain.
geometryShape  = AbruptExpansion   # but with default jLow=0, jHigh=J? Let's rely on code default.

# Boundary conditions
lateralBC      = SolidWall        # no-slip at y=0 and y=Y
outletBC       = ZeroFirstDeriv   # outflow
initialProfile = InletProfile      # parabolic at inlet (x=0)

# Time integration
flowType       = SteadyMarching
maxTimeSteps   = 5000
convergenceTol = 1e-10
numPressureIter = 5
reportEveryN   = 500

# Output
outputDir      = experiments/results/poiseuille
runName        = poiseuille_re100
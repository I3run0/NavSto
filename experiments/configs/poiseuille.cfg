# ============================================================
# Poiseuille flow between parallel plates (y-direction walls)
# Exact parabolic profile: u(y) = 6*yNorm*(1-yNorm)*Umax, Re=100
#
# Used by scripts/validate.py as an analytical correctness check:
# geometryShape=Straight is a true straight channel at every x (no
# expansion/contraction/corner), and lateralBC=Periodic makes the z
# direction translationally invariant instead of walled, so a thin
# numCellsZ behaves as genuine 2D rather than degenerating (a walled
# numCellsZ=1 channel computes nothing at all — the z-direction loop
# bound collapses to zero iterations; see CHANGELOG known issues for
# the version of this config that hit that).
# ============================================================

# Grid resolution (fine enough for profile capture)
numCellsX      = 40
numCellsY      = 40
numCellsZ      = 4

# Physical domain (length X, height Y, depth Z)
domainLengthX  = 4.0
domainLengthY  = 1.0
domainLengthZ  = 0.4

# Reynolds number
reynoldsNumber = 100.0

# Hyper‑viscous sponge (disabled)
hyperViscousRe = 20.0
hyperViscousStart = 0

# Geometry: genuinely straight channel, full domain active at every x
geometryShape  = Straight

# Boundary conditions
lateralBC      = Periodic         # translationally invariant in z (true 2D)
outletBC       = ZeroFirstDeriv   # outflow
initialProfile = InletProfile      # exact parabolic profile, copied to every x

# Time integration
flowType       = SteadyMarching
maxTimeSteps   = 20
convergenceTol = 0
numPressureIter = 5
reportEveryN   = 20

# Output
outputDir      = experiments/results/poiseuille
runName        = poiseuille_re100

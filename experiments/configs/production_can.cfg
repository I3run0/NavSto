# ======================================================================
# Rounded corner channel (Geometria = "Cam")
# Reynolds number = 10,000  (turbulent / transitional)
# Unsteady flow – RK4 time integration
# Fine grid, long simulation time to capture statistics
# ======================================================================

# ─── Grid (II x JJ x KK) ─────────────────────────────────────────────
# Approximately 1.2M cells – runs on a workstation (8–16 GB RAM)
numCellsX      = 360      # 9 * NN (NN = 40) – fine in streamwise direction
numCellsY      = 120      # 3 * NN – good spanwise resolution
numCellsZ      = 60       # 1.5 * NN – enough for 3D structures

# ─── Physical domain (same as original) ──────────────────────────────
domainLengthX  = 9.0      # extended for development (Cmp = 6 → 9)
domainLengthY  = 3.0      # Alt = 2 → 3 (taller channel)
domainLengthZ  = 1.5      # Lrg = 1 → 1.5 (wider span)

# ─── Physics ─────────────────────────────────────────────────────────
reynoldsNumber = 10000.0
hyperViscousRe = 500.0    # mild sponge near outlet
hyperViscousStart = 300   # activate sponge in last 60 cells (II - 300)

# ─── Time integration (unsteady) ─────────────────────────────────────
flowType       = RK4Transient
maxTimeSteps   = 200000   # ~200 convective time units
convergenceTol = 1e-6     # not critical for transient; residuals will oscillate
numPressureIter = 10      # tighter Poisson solver
reportEveryN   = 2000     # reduce I/O overhead

# ─── Geometry & BCs (same as NavSto_dynamic.cpp) ─────────────────────
geometryShape  = RoundedCorner
geometryType   = Curved
lateralBC      = Periodic
outletBC       = ZeroFirstDeriv
initialProfile = PotentialFlow   # start from potential flow, then develop

# ─── Output ──────────────────────────────────────────────────────────
outputDir      = results/production_cam_re10000
runName        = cam_re10000
# ==============================================================================
#  NavSolver configuration  —  Rounded-corner channel, Re=9600
#
#  Matches NavSto_dynamic.cpp main() exactly:
#    TipoGeometria = "Crv"  →  geometryType  = Curved
#    Geometria     = "Cam"  →  geometryShape = RoundedCorner
#    PerfilInicial = "LCP"  →  initialProfile = PotentialFlow
#    CondSaida     = "1d0"  →  outletBC      = ZeroFirstDeriv
#    CondLater     = "prd"  →  lateralBC     = Periodic
#    itp = 0               →  flowType      = SteadyMarching
#    Re  = 9600, NN = 40
#    Cmp = 6.0, Alt = 2.0, Lrg = 1.0
#    II  = 6*NN = 240, JJ = 2*NN = 80, KK = NN = 40
#    dx  = Cmp/II = 0.025, dy = Alt/JJ = 0.025, dz = Lrg/KK = 0.025
# ==============================================================================

# Grid  (II x JJ x KK)
numCellsX      = 180
numCellsY      = 60
numCellsZ      = 60
baseUnit       = 20

# Physical domain  (Cmp x Alt x Lrg)
domainLengthX  = 6.0
domainLengthY  = 2.0
domainLengthZ  = 1.0

# Physics
reynoldsNumber = 1000.0
hyperViscousRe = 20.0
hyperViscousStart = 0

# Time integration
maxTimeSteps   = 10000
reportEveryN   = 200
convergenceTol = 1e-6
numPressureIter = 5

# Geometry and boundary conditions
geometryShape  = RoundedCorner
geometryType   = Curved
lateralBC      = Periodic
outletBC       = ZeroFirstDeriv
initialProfile = PotentialFlow
flowType       = SteadyMarching

# Output
outputDir      = experiments/results/cam_re960
runName        = cam_re960
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # Covers the unit suites and the solver-level validation scripts
      # (physics correctness, OpenMP thread-count equivalence); both are
      # registered as ctest tests in CMakeLists.txt.
      - name: Tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test
        run: |
          printf 'numCellsX = 12\nnumCellsY = 8\nnumCellsZ = 8\ngeometryShape = AbruptExpansion\nmaxTimeSteps = 10\nreportEveryN = 5\n' \
            > /tmp/navsolver_check.cfg
          ./build/navsolver /tmp/navsolver_check.cfg

      # The one check ctest does not cover: benchmark.py reports timings
      # rather than passing or failing, so it is a target, not a test.
      - name: Benchmark harness smoke check
        if: matrix.build_type == 'Release'
        run: python3 scripts/benchmark.py --sizes tiny --steps 10 --repeats 1 --skip-build

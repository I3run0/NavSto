# ==============================================================================
#  NavSolver configuration  —  Re=100 abrupt-expansion channel
#
#  Open in ParaView:  File → Open → results/navsolver_run_t*.vtk → Apply
#  Use Filters → Glyph (for velocity vectors) or Contour (for pressure).
# ==============================================================================

# Grid resolution
numCellsX      = 48
numCellsY      = 24
numCellsZ      = 24
baseUnit       = 12

# Physics
reynoldsNumber = 100.0
hyperViscousRe = 1.0
hyperViscousStart = 0

# Time integration
maxTimeSteps   = 10000
reportEveryN   = 500
convergenceTol = 1e-6
numPressureIter = 5

# Geometry and boundary conditions
geometryShape  = AbruptExpansion
geometryType   = Axial
lateralBC      = Periodic
outletBC       = ZeroFirstDeriv
initialProfile = InletProfile
flowType       = RK4Transient

# Output
outputDir      = results
runName        = navsolver_run
